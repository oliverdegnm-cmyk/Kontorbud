<svg viewBox="0 0 1400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DCE4FB"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="400" fill="url(#bg)"/>

  <!-- baggrunds-cirkler for dybde -->
  <circle cx="1220" cy="80" r="140" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="340" r="110" fill="#fff" opacity="0.3"/>

  <!-- skrivebord -->
  <rect x="0" y="300" width="1400" height="100" fill="#C9D3F5"/>
  <rect x="0" y="296" width="1400" height="10" fill="#B4C0EE"/>

  <!-- krøllede papirbolde -->
  <g fill="#fff" stroke="#B9C4EA" stroke-width="3">
    <circle cx="150" cy="330" r="20"/>
    <circle cx="210" cy="345" r="15"/>
    <circle cx="1180" cy="335" r="18"/>
    <circle cx="1260" cy="320" r="14"/>
    <circle cx="1050" cy="345" r="12"/>
  </g>

  <!-- telefon -->
  <g>
    <rect x="1290" y="255" width="70" height="55" rx="6" fill="#14213D"/>
    <rect x="1300" y="264" width="50" height="20" rx="2" fill="#3A4A6B"/>
  </g>

  <!-- briller -->
  <g stroke="#14213D" stroke-width="4" fill="none">
    <circle cx="90" cy="300" r="18"/>
    <circle cx="130" cy="300" r="18"/>
    <line x1="108" y1="300" x2="112" y2="300"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="560" y="150" width="220" height="150" rx="8" fill="#fff" stroke="#14213D" stroke-width="4"/>
    <rect x="580" y="170" width="180" height="110" fill="#2A55E5" opacity="0.15"/>
    <rect x="540" y="296" width="260" height="14" rx="4" fill="#14213D"/>
  </g>

  <!-- person: arme og krop hvilende på laptop -->
  <g>
    <!-- torso/skjorte -->
    <path d="M480 300 C480 220 540 190 620 190 L700 190 C740 190 760 220 760 260 L760 300 Z" fill="#2A55E5"/>
    <!-- venstre arm hvilende foran -->
    <path d="M500 300 C500 260 540 250 590 255 C620 258 630 275 640 300 Z" fill="#1B3AA6"/>
    <!-- højre arm -->
    <path d="M760 300 C765 255 800 245 830 260 C850 270 845 290 840 300 Z" fill="#1B3AA6"/>
    <!-- hoved hvilende på arme, set skråt/nedad -->
    <ellipse cx="660" cy="255" rx="46" ry="42" fill="#F3C9A0"/>
    <path d="M614 240 C614 205 700 200 706 240 C706 215 660 205 614 240 Z" fill="#6B4A32"/>
  </g>

  <!-- HJÆLP-flag -->
  <g>
    <line x1="900" y1="120" x2="900" y2="240" stroke="#14213D" stroke-width="6" stroke-linecap="round"/>
    <path d="M900 122 L1080 122 L1060 165 L1080 208 L900 208 Z" fill="#fff" stroke="#C0392B" stroke-width="4"/>
    <text x="925" y="176" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#C0392B">HJÆLP!</text>
  </g>
</svg>
